font_family JetBrainsMono Nerd Font
font_size 12

enable_audio_bell no

confirm_os_window_close 0

shell_integration enabled
include cyberdream.conf
background_opacity 0.3
background_blur 64
shell tmux new-session
hide_window_decorations yes


cursor_trail 3
cursor_trail_decay 0.1 0.4


# Set the border thickness (in pts)
window_border_width 2.0pt

# Optional: Add a gap between multiple windows (in pixels)
window_margin_width 4
# --- GLOW & TEXT BLOOM ---
text_composition_strategy legacy
text_shadow_offset_x 1
text_shadow_offset_y 1
text_shadow_blur 3

# --- CURSOR TRAIL GLOW ---
cursor #f5e0dc
cursor_text_color #11111b
cursor_trail 8
cursor_trail_decay 0.05 0.3
cursor_trail_start_threshold 2

# --- BORDERS & MARGINS ---
window_border_width 2.0pt
window_margin_width 4
active_border_color #cba6f7
inactive_border_color #313244

shader = ~/.config/crtty/shaders/bloom.glsl

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
